<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boolean Crop Condition Classifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f7f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #2e7d32;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        #result {
            margin-top: 25px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Crop Condition Classifier</h1>

    <label>Temperature (°C)</label>
    <input type="number" id="temperature" placeholder="Enter temperature">

    <label>Humidity (%)</label>
    <input type="number" id="humidity" placeholder="Enter humidity">

    <label>Soil Moisture (%)</label>
    <input type="number" id="soil" placeholder="Enter soil moisture">

    <label>Rainfall (mm)</label>
    <input type="number" id="rainfall" placeholder="Enter rainfall">

    <button onclick="classifyCrop()">Check Crop Condition</button>

    <div id="result"></div>

</div>

<script>
function classifyCrop() {

    let temperature = parseFloat(document.getElementById("temperature").value);
    let humidity = parseFloat(document.getElementById("humidity").value);
    let soil = parseFloat(document.getElementById("soil").value);
    let rainfall = parseFloat(document.getElementById("rainfall").value);

    if (isNaN(temperature) || isNaN(humidity) ||
        isNaN(soil) || isNaN(rainfall)) {

        document.getElementById("result").innerHTML =
            "Please enter all values.";

        return;
    }

    /*
       Crop condition decision
       Suitable when:
       Temperature: 20 - 35 °C
       Humidity: 40 - 90 %
       Soil Moisture: 30 - 80 %
       Rainfall: 10 - 200 mm
    */

    let suitable =
        temperature >= 20 && temperature <= 35 &&
        humidity >= 40 && humidity <= 90 &&
        soil >= 30 && soil <= 80 &&
        rainfall >= 10 && rainfall <= 200;

    if (suitable) {
        document.getElementById("result").innerHTML =
            "🌱 Crop Condition: Suitable";
    } else {
        document.getElementById("result").innerHTML =
            "⚠️ Crop Condition: Not Suitable";
    }
}
</script>

</body>
</html>
