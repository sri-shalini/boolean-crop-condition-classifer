<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boolean Crop Condition Classifier</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f8f4;
    color: #263238;
}

header {
    background: linear-gradient(135deg, #14532d, #2e7d32);
    color: white;
    padding: 45px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 38px;
}

header p {
    margin-top: 12px;
    font-size: 18px;
    opacity: 0.95;
}

.container {
    width: 92%;
    max-width: 1050px;
    margin: 30px auto;
}

.card {
    background: white;
    padding: 28px;
    margin-bottom: 25px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.card h2 {
    color: #1b5e20;
    margin-top: 0;
    border-left: 5px solid #43a047;
    padding-left: 12px;
}

.card p {
    line-height: 1.7;
    color: #455a64;
}

/* Simulator */

.input-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.input-box label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
    color: #37474f;
}

.input-box input {
    width: 100%;
    padding: 12px;
    border: 1px solid #cfd8dc;
    border-radius: 8px;
    font-size: 16px;
}

.input-box input:focus {
    outline: none;
    border-color: #43a047;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #2e7d32;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}
